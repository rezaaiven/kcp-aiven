# Aiven API credentials for KCP create-asset target-infra-aiven and Terraform.
# Copy this file to aiven-credentials.yaml (in your project root) and fill in your values.
# Alternatively, set AIVEN_TOKEN or AIVEN_API_TOKEN in the environment; env vars take precedence.
#
# The Aiven Terraform provider also accepts AIVEN_TOKEN when running terraform apply.
# Get your token: Aiven Console → Account → Authentication → API token.
# See: https://help.aiven.io/en/articles/2059201-authentication-tokens

api_token: "your-aiven-api-token"
