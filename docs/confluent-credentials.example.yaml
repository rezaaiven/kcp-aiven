# Confluent Cloud API credentials for KCP discover-confluent and Confluent → Aiven migration.
# Copy this file to confluent-credentials.yaml (in your project root) and fill in your values.
# Alternatively, set CONFLUENT_API_KEY and CONFLUENT_API_SECRET (and optionally
# CONFLUENT_ENVIRONMENT_ID) in the environment; env vars take precedence over this file.
#
# Get API keys: Confluent Cloud Console → API keys (Cloud API or cluster-scoped).
# See: https://docs.confluent.io/cloud/current/access-management/authenticate/api-keys/api-keys.html

api_key: "your-confluent-api-key"
api_secret: "your-confluent-api-secret"
# Optional: restrict discovery to this environment ID (e.g. env-xyz123). Leave empty to list all.
environment_id: ""
